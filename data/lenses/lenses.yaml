    anchors:
      - >-
        The maintenance of international peace and security is the first purpose of this
        Organization. The arms race between the great Powers and the conflicts that persist in several
        regions keep humanity in fear of a new world war. We call for negotiations in good faith, the
        peaceful settlement of disputes and general and complete disarmament under effective
        international control.
      - >-
        United Nations peace-keeping operations have helped to contain conflicts, supervise ceasefires
        and create conditions for negotiated settlements. My country is proud to have contributed troops
        to these missions. The Security Council must be able to act promptly to prevent the outbreak of
        hostilities, and peace-keeping must be accompanied by efforts to address the root causes of
        conflict.
      - >-
        The end of the cold war has opened new opportunities for preventive diplomacy, peacemaking and
        post-conflict peace-building, as set out in An Agenda for Peace. Yet ethnic and civil conflicts
        continue to take a terrible toll on civilians. The United Nations must strengthen its capacity
        for early warning and mediation, so that disputes are resolved before they turn into war.
      - >-
        We welcome the ceasefire agreement and the resumption of direct negotiations between the
        parties. A just and lasting peace can only be achieved through dialogue, respect for the
        territorial integrity and sovereignty of States and the full implementation of the relevant
        Security Council resolutions. The international community must help the parties build
        confidence and rebuild war-torn areas.
      - >-
        After decades of armed conflict, the signing of the peace agreement has opened a new chapter for
        our nation. Implementing it requires the reintegration of former combatants, reparation for
        victims, rural development and the presence of the State in territories long affected by
        violence. We are grateful to the Security Council for accompanying this process through its
        verification mission.
      - >-
        Sustaining peace requires more than the absence of war. Conflict prevention, inclusive political
        processes, the full participation of women in peace negotiations and investment in
        peacebuilding are more effective and less costly than responding to crises after they erupt.
        The Peacebuilding Commission and the good offices of the Secretary-General deserve our full
        support.
      - >-
        The war raging on our continent, with the bombardment of cities, millions of displaced persons
        and threats to use nuclear weapons, is the gravest challenge to international peace and security
        in decades. The principles of the Charter prohibiting the threat or use of force must be upheld.
        We call for an immediate cessation of hostilities and a return to diplomacy.
